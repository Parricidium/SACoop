[SACoop]
; Fenetre : 2 = plein ecran sans bordure (conseille), 1 = fenetre, 0 = plein ecran du jeu
Fenetre=2
; Images par seconde (le jeu d'origine est prevu pour 25-30). 30 = fluide et stable comme dans VCCoop ;
; 60 reactive les corrections de cadence, plus fragiles. Les deux joueurs devraient avoir la meme valeur.
ImagesParSeconde=30
; Sauter les logos et la video d'ouverture
SansIntro=1
; Grand ecran : 3D aux proportions de l'ecran, champ de vision elargi (1 = oui)
GrandEcran=1
; Reglages et sauvegardes dans le dossier du jeu (a part de vos sauvegardes solo)
SauvegardesLocales=1
; Votre tenue (sur vous et chez les autres) : 0 = CJ avec vos vetements, 1 a 299 = un pieton du jeu
Tenue=0
; Tir ami : 1 = les autres joueurs peuvent vous blesser, 0 = non (chacun choisit pour lui)
TirAmi=1
; Vue a la premiere personne a pied : 1 = la touche ToucheVue la bascule
VuePremierePersonne=1
; Rendu moderne : occlusion ambiante et anticrenelage FXAA (1 = oui)
OcclusionAmbiante=1
Anticrenelage=1
; Mods partages (dossier SACoop\mods) : 1 = charges, et envoyes aux invites par le salon
ModsPartages=1
; Memoire de streaming (Mo) quand des mods sont charges
MemoireStreaming=256
ToucheVue=F6
; Recherche partagee : 1 = un seul niveau de recherche pour tous (le plus haut)
RecherchePartagee=1
; Police de l'hote : 1 = elle poursuit aussi les invites recherches
PoliceHote=1
; Port UDP de l'hote (a ouvrir sur sa box pour jouer par Internet)
Port=7800

; --- Robustesse reseau (portage de VCCoop) : chaque module se coupe ici pour chercher une panne (1 = actif) ---
; Interpolation : les autres joueurs, vehicules et pietons de mission sont montres ~110 ms dans le passe, entre deux etats recus
Interpolation=1
DelaiInterpolation=110
; Placement apres la physique du jeu (pietons distants / vehicules distants / pietons de mission chez l'invite)
PlacementPietons=1
PlacementVehicules=1
; Les copies de vehicules ne sont plus poussees par la physique locale (evite les secousses et les rebonds)
GelerCopies=1
; Garde-fou : remet en etat tout vehicule ou pieton dont la matrice/vitesse devient absurde (NaN) avant qu'il ne plante le jeu
GardeFou=1
; Miroir etendu : ~120 commandes de mission de plus repliquees chez l'invite (textes, blips, camera, garages, objets...)
MiroirEtendu=1
; Cinematiques : les doubles reseau (pantin de l'autre joueur, copies de PNJ et de vehicules de mission) sont caches pendant une
; cinematique, ils se tenaient dans la scene par-dessus les acteurs et scintillaient (0 = visibles comme avant)
CacherEnCinematique=1
; Marqueurs du radar : l'hote envoie l'etat de ses marqueurs de coordonnees et de points de contact (ceux de la mission
; suivante, apres une mission...) et l'invite les reproduit ; avant, l'invite gardait seulement ceux de sa sauvegarde
MarqueursRadar=1
; Chute : un joueur tombe sous le monde (collisions pas encore chargees) est remis a sa derniere position sure
SecoursChute=1
; Death: 1 = the player keeps his weapons when he dies (they are given back about 1.5 s after the respawn; only what is
; missing is given). 0 = weapons are lost like in the original game
ArmesMort=1
; Weather: 1 = a guest never changes the weather by itself, it only follows the host (the sky colours at dusk and dawn
; used to flicker because the guest's game kept restarting the weather change). 0 = old behaviour
GuestWeatherGuard=1
; Radio: 1 = the host's radio is the reference. The guests hear the same station, the same track at the same point and the
; same adverts as the host (they follow it when they are tuned to the same station). Custom radio ("User Tracks") follows
; only if both PCs have the same track library. 0 = every PC plays its own random tracks
RadioSync=1
; Trains: 1 = the host's trains (the random ones and the mission ones) run on every guest's rails: same place, same speed, same
; direction. The guest's own random trains are switched off while the host shares its trains. Whoever drives a train owns it.
; Both PCs must have it on. 0 = every PC runs its own trains, like the original game
TrainSync=1

; Missions: 1 = a guest cannot start a story mission by walking into its start marker (the marker is still drawn, so the
; guest can show the host where it is); only the host starts missions. 0 = a guest's own game acts on the marker, like before
GuestMissionLock=1

; Diagnostic des saccades : 1 = le fil du jeu est echantillonne toutes les 20 ms et le journal dit ou il passe son temps
; (le releve de la charge du processeur et des processus gourmands est toujours journalise, toutes les 10 s)
Profil=0

; Affinite du processeur : coeur auquel le jeu est limite au lancement (le jeu d'origine est ecrit pour un seul coeur ; corrige le
; curseur de souris qui derape). 0 = premier coeur, -1 = pas de restriction
AffiniteCoeur=0
